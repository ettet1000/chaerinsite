<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>채린이의 공부방 with 토루</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-color: #A78BFA; /* 따뜻한 파스텔 보라 계열로 톤 변경 */
            --success-color: #34D399;
            --danger-color: #F87171;
            --warm-bg: #FFFBEB; /* 첫 화면 따뜻한 아이보리 배경 */
            --quiz-bg: #F0F4F8;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--warm-bg);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            transition: background-color 0.3s ease;
        }

        .app-wrapper {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            position: relative;
        }

        /* 첫 화면 환영 메시지 스타일 */
        .welcome-box {
            text-align: center;
            margin: 15px 0;
            background: #FEF3C7;
            padding: 16px;
            border-radius: 20px;
            border: 2px dashed #FBBF24;
            font-size: 18px;
            font-weight: bold;
            color: #92400E;
            word-break: keep-all;
        }

        h1 { 
            color: var(--primary-color); 
            margin: 10px 0 20px 0; 
            font-size: calc(22px + 1.5vw); 
            text-align: center;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .btn {
            padding: 16px 20px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s;
            width: 100%;
            touch-action: manipulation; 
        }

        .btn-category {
            background-color: #F3F4F6;
            color: #374151;
            border: 2px solid #E5E7EB;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn:active { transform: scale(0.97); }

        .hidden { display: none !important; }
        
        .quiz-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            color: #6B7280;
            font-size: 15px;
            font-weight: bold;
        }

        .quiz-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        /* 토루 이미지 프레임 및 인터랙션 액션 정의 */
        .character-frame {
            width: 140px;
            height: 140px;
            border-radius: 24px;
            overflow: hidden;
            background: #F3F4F6;
            border: 3px solid #E5E7EB;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        
        .character-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 정답 시 토루 바운스 효과 */
        .character-frame.bounce {
            animation: bounce 0.4s infinite alternate;
            border-color: var(--success-color);
            box-shadow: 0 0 12px rgba(52, 211, 153, 0.5);
        }

        /* 오답 시 토루 시각 처리 */
        .character-frame.dimmed {
            filter: grayscale(60%);
            border-color: var(--danger-color);
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-12px); }
        }

        .question-box {
            font-size: calc(18px + 1vw);
            font-weight: bold;
            width: 100%;
            padding: 20px;
            background: #F9FAFB;
            border: 2px solid #E5E7EB;
            border-radius: 20px;
            word-break: keep-all;
            text-align: center;
        }

        .options-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: auto;
        }

        .btn-option {
            background-color: #F9FAFB;
            color: #1F2937;
            text-align: left;
            border: 2px solid #E5E7EB;
            padding: 18px 20px;
        }
        
        .btn-option.correct { background-color: #D1FAE5; border-color: var(--success-color); color: #065F46; }
        .btn-option.wrong { background-color: #FEE2E2; border-color: var(--danger-color); color: #991B1B; animation: shake 0.4s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-6px); }
        }

        .btn-main {
            background-color: var(--primary-color);
            color: white;
            margin-top: 20px;
            padding: 18px;
            box-shadow: 0 4px #7C3AED;
        }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div id="menu-view">
        <h1>🧸 토루의 공부방</h1>
        <div class="quiz-body" style="margin-bottom: 20px;">
            <div class="character-frame">
                <img src="./bunny.png" alt="토루">
            </div>
            <div class="welcome-box">
                ✨ 안녕, 임채린! 오늘도 토루랑 같이 재밌게 공부해볼까? 원하는 과목을 골라줘!
            </div>
        </div>
        <div class="menu-list">
            <button class="btn btn-category" onclick="startQuiz('math_calc')"><span>🧮</span> 수학 연산</button>
            <button class="btn btn-category" onclick="startQuiz('math_fraction')"><span>🍰</span> 분수 공부</button>
            <button class="btn btn-category" onclick="startQuiz('math_geometry')"><span>📐</span> 도형 교실</button>
            <button class="btn btn-category" onclick="startQuiz('eng_word')"><span>🦁</span> 필수 영단어</button>
            <button class="btn btn-category" onclick="startQuiz('eng_expression')"><span>💬</span> 영어 회화</button>
        </div>
    </div>

    <div id="quiz-view" class="hidden" style="display: flex; flex-direction: column; flex: 1;">
        <div class="quiz-header">
            <span id="category-title">카테고리</span>
            <span id="progress-text">0 / 0</span>
        </div>
        
        <div class="quiz-body">
            <div id="toru-frame" class="character-frame">
                <img src="./bunny.png" alt="토루">
            </div>
            <div id="question" class="question-box">로딩 중...</div>
        </div>
        
        <div id="options" class="options-box">
            </div>

        <button id="next-btn" class="btn btn-main hidden" onclick="nextQuestion()">다음 문제로 가기 ▶</button>
    </div>

    <div id="result-view" class="hidden">
        <h1>🎉 공부 끝!</h1>
        <div class="quiz-body">
            <div class="character-frame bounce">
                <img src="./bunny.png" alt="토루">
            </div>
        </div>
        <div class="question-box" id="result-score" style="font-size: 20px; border: none; background: transparent; margin: 20px 0;">0점</div>
        <button class="btn btn-main" onclick="showMenu()">다른 과목 또 하기</button>
    </div>
</div>

<script>
    const state = { dataset: null, currentCategory: '', questions: [], currentIndex: 0, score: 0, isAnswered: false };

    async function initDataset() {
        try {
            const response = await fetch('./dataset.json');
            if (!response.ok) throw new Error();
            state.dataset = await response.json();
        } catch (error) {
            alert('dataset.json 파일 로드 실패');
        }
    }

    function startQuiz(category) {
        if (!state.dataset || !state.dataset[category]) return;
        document.body.style.backgroundColor = "var(--quiz-bg)"; // 퀴즈 진입 시 배경 전환
        state.currentCategory = category;
        state.questions = [...state.dataset[category]].sort(() => Math.random() - 0.5).slice(0, 5); 
        state.currentIndex = 0;
        state.score = 0;

        document.getElementById('menu-view').classList.add('hidden');
        document.getElementById('result-view').classList.add('hidden');
        document.getElementById('quiz-view').classList.remove('hidden');

        const titleMap = { math_calc: '🧮 수학 연산', math_fraction: '🍰 분수 공부', math_geometry: '📐 도형 교실', eng_word: '🦁 필수 영단어', eng_expression: '💬 영어 회화' };
        document.getElementById('category-title').innerText = titleMap[category];
        renderQuestion();
    }

    function renderQuestion() {
        state.isAnswered = false;
        document.getElementById('next-btn').classList.add('hidden');
        
        const frame = document.getElementById('toru-frame');
        frame.className = 'character-frame'; // 상태 리셋
        
        const currentQ = state.questions[state.currentIndex];
        document.getElementById('progress-text').innerText = `${state.currentIndex + 1} / ${state.questions.length}`;
        document.getElementById('question').innerText = currentQ.q;

        const allOptions = [currentQ.a, ...currentQ.o].sort(() => Math.random() - 0.5);
        const optionsContainer = document.getElementById('options');
        optionsContainer.innerHTML = '';

        allOptions.forEach(option => {
            const button = document.createElement('button');
            button.className = 'btn btn-option';
            button.innerText = option;
            button.onclick = () => checkAnswer(button, option, currentQ.a);
            optionsContainer.appendChild(button);
        });
    }

    function checkAnswer(selectedButton, selectedValue, correctValue) {
        if (state.isAnswered) return;
        state.isAnswered = true;

        const buttons = document.getElementById('options').getElementsByTagName('button');
        const frame = document.getElementById('toru-frame');

        if (selectedValue === correctValue) {
            selectedButton.classList.add('correct');
            state.score++;
            frame.classList.add('bounce'); // 정답 시 토루 신나게 바운스
            confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
        } else {
            selectedButton.classList.add('wrong');
            frame.classList.add('dimmed'); // 오답 시 토루 격려 모드(채도 감소)
            for (let btn of buttons) {
                if (btn.innerText === correctValue) btn.classList.add('correct');
            }
        }
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
        state.currentIndex++;
        if (state.currentIndex < state.questions.length) { renderQuestion(); } else { showResult(); }
    }

    function showResult() {
        document.getElementById('quiz-view').classList.add('hidden');
        document.getElementById('result-view').classList.remove('hidden');
        document.getElementById('result-score').innerText = `💯 채린아, 5문제 중 ${state.score}문제를 맞혔어!`;
        if(state.score === 5) {
            confetti({ particleCount: 150, spread: 80 });
        }
    }

    function showMenu() {
        document.body.style.backgroundColor = "var(--warm-bg)";
        document.getElementById('result-view').classList.add('hidden');
        document.getElementById('menu-view').classList.remove('hidden');
    }

    window.onload = initDataset;
</script>
</body>
</html>
